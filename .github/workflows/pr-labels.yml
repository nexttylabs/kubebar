name: PR Labels

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scope-labels:
    name: Scope labels
    runs-on: arc-small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  classify:
    name: Size / Risk / Tier
    runs-on: arc-small
    steps:
      - uses: actions/checkout@v4
      - name: Classify PR
        uses: actions/github-script@v7
        with:
          script: |
            const classify = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-labeler.js`)
            await classify({ github, context, core })
