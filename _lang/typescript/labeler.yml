scope:source:
  - changed-files:
      - any-glob-to-any-file: "src/**"

scope:lib:
  - changed-files:
      - any-glob-to-any-file: "lib/**"

scope:tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "**/*.test.ts"
          - "**/*.spec.ts"

scope:deps:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"

scope:config:
  - changed-files:
      - any-glob-to-any-file:
          - "tsconfig.json"
          - "tsconfig.*.json"
          - ".eslintrc*"
          - "eslint.config.*"
          - ".prettierrc*"
          - "vitest.config.*"
          - "jest.config.*"
