scope:cmd:
  - changed-files:
      - any-glob-to-any-file: "cmd/**"

scope:internal:
  - changed-files:
      - any-glob-to-any-file: "internal/**"

scope:pkg:
  - changed-files:
      - any-glob-to-any-file: "pkg/**"

scope:api:
  - changed-files:
      - any-glob-to-any-file: "api/**"

scope:tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "**/*_test.go"
          - "**/testdata/**"

scope:deps:
  - changed-files:
      - any-glob-to-any-file:
          - "go.mod"
          - "go.sum"
