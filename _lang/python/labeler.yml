scope:source:
  - changed-files:
      - any-glob-to-any-file: "src/**"

scope:tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "**/test_*.py"
          - "**/*_test.py"

scope:scripts:
  - changed-files:
      - any-glob-to-any-file: "scripts/**"

scope:deps:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "setup.cfg"
          - "requirements*.txt"
          - "uv.lock"

scope:config:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "setup.cfg"
          - "mypy.ini"
          - ".mypy.ini"
          - "ruff.toml"
          - ".ruff.toml"
          - "pytest.ini"
          - "conftest.py"
