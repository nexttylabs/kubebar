scope:core:
  - changed-files:
      - any-glob-to-any-file: "src/**/*.rs"

scope:crates:
  - changed-files:
      - any-glob-to-any-file: "crates/**"

scope:tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "benches/**"

scope:migrations:
  - changed-files:
      - any-glob-to-any-file: "migrations/**"

scope:deps:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"
